<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco Marcano</title>
    <style>
        /* Estilos sencillos para el menú */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #1F3A4F; /* Tu azul oscuro */
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .menu-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 250px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 5px solid #F4A261; /* Tu color naranja */
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .card h2 {
            margin-top: 0;
            color: #1F3A4F;
        }
        .card p {
            margin-bottom: 0;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background-color: #1F3A4F;
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #F4A261;
        }
    </style>
</head>
<body>

    <h1>Francisco Marcano</h1>
    <p>Selecciona el proyecto que deseas visualizar:</p>

    <div class="menu-container">
        <!-- Enlace a la carpeta del CV -->
        <a href="/cv-perfil/" class="card">
            <h2>📄 Mi CV / Perfil</h2>
            <p>Visualiza mi hoja de vida profesional y experiencia.</p>
            <span class="btn">Ir al CV</span>
        </a>

        <!-- Enlace a la carpeta de la página web actual -->
        <a href="/proyecto-web/" class="card">
            <h2>💻 Proyecto Web Actual</h2>
            <p>La nueva página web con mi foto y servicios.</p>
            <span class="btn">Ir al Proyecto</span>
        </a>
    </div>

</body>
</html>
